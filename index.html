<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#05070b">

<title>Kainthla Travel AI</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
    background:#05070b;
    color:#fff;
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

body{
    overflow-x:hidden;
}

/* =========================
   GLOBAL
========================= */

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

a{
    color:inherit;
    text-decoration:none;
}

/* =========================
   360 IMAGE CONFIG
========================= */

:root{

    --travel-360-image:
        url("1aebea2f-ed66-4843-80ef-f381f65cfe50.web");

    --ai-api-url:
        "https://script.google.com/macros/s/AKfycbwxZhBDGOTa4TFN2XAg_ihpIuvVbjJPiDzGt3vpyfuOqZdUXHzOYZ-YoP1Pe7tJZk-ldg/exec";

}

/* =========================
   BACKGROUND
========================= */

.background{

    position:fixed;

    inset:0;

    z-index:0;

    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(35,90,150,.18),
            transparent 42%
        ),
        #05070b;

}

.background::before{

    content:"";

    position:absolute;

    inset:-20%;

    background-image:
        var(--travel-360-image);

    background-size:cover;

    background-position:center;

    opacity:.12;

    filter:
        blur(3px)
        saturate(.8);

    transform:scale(1.08);

}

.background::after{

    content:"";

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            to bottom,
            rgba(5,7,11,.35),
            rgba(5,7,11,.82)
        );

}

/* =========================
   APP
========================= */

.app{

    position:relative;

    z-index:1;

    width:100%;

    min-height:100vh;

}

/* =========================
   NAVBAR
========================= */

.navbar{

    width:100%;

    padding:
        18px
        20px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    position:relative;

    z-index:10;

}

.logo{

    display:flex;

    align-items:center;

    gap:10px;

    font-size:17px;

    font-weight:700;

    letter-spacing:.4px;

}

.logo-mark{

    width:38px;
    height:38px;

    border-radius:13px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #b9c7d8
        );

    color:#05070b;

    box-shadow:
        0 8px 30px
        rgba(255,255,255,.12);

}

.logo-text{

    display:flex;

    flex-direction:column;

}

.logo-text small{

    font-size:9px;

    opacity:.5;

    letter-spacing:1.8px;

    text-transform:uppercase;

}

/* =========================
   HERO
========================= */

.hero{

    min-height:
        calc(100vh - 75px);

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    padding:
        35px
        20px
        110px;

    text-align:center;

}

.badge{

    display:inline-flex;

    align-items:center;

    gap:8px;

    padding:
        8px
        13px;

    border:1px solid
        rgba(255,255,255,.12);

    border-radius:999px;

    background:
        rgba(255,255,255,.045);

    backdrop-filter:blur(14px);

    color:
        rgba(255,255,255,.72);

    font-size:11px;

    letter-spacing:1.2px;

    text-transform:uppercase;

    margin-bottom:22px;

}

.badge-dot{

    width:6px;
    height:6px;

    border-radius:50%;

    background:#9fe7ff;

    box-shadow:
        0 0 14px #9fe7ff;

}

.hero h1{

    max-width:800px;

    font-size:
        clamp(
            42px,
            11vw,
            92px
        );

    line-height:.95;

    letter-spacing:-4px;

    font-weight:800;

}

.hero h1 span{

    background:
        linear-gradient(
            120deg,
            #ffffff,
            #8da9c7,
            #ffffff
        );

    -webkit-background-clip:text;

    background-clip:text;

    color:transparent;

}

.hero p{

    max-width:580px;

    margin-top:22px;

    color:
        rgba(255,255,255,.58);

    font-size:
        clamp(
            14px,
            3.5vw,
            17px
        );

    line-height:1.7;

}

/* =========================
   START BUTTON
========================= */

.start-btn{

    margin-top:35px;

    padding:
        15px
        24px;

    border:1px solid
        rgba(255,255,255,.2);

    border-radius:16px;

    background:
        rgba(255,255,255,.09);

    color:#fff;

    display:flex;

    align-items:center;

    gap:10px;

    transition:
        .25s ease;

    backdrop-filter:blur(15px);

}

.start-btn:hover{

    transform:
        translateY(-3px);

    background:
        rgba(255,255,255,.15);

}

/* =========================
   AI CHAT
========================= */

.chat-section{

    width:100%;

    max-width:850px;

    margin:
        0 auto;

    padding:
        20px;

}

.chat-box{

    border:
        1px solid
        rgba(255,255,255,.1);

    border-radius:25px;

    background:
        rgba(10,14,21,.72);

    backdrop-filter:
        blur(25px);

    box-shadow:
        0 30px 80px
        rgba(0,0,0,.35);

    overflow:hidden;

}

.chat-header{

    padding:18px 20px;

    border-bottom:
        1px solid
        rgba(255,255,255,.08);

    display:flex;

    align-items:center;

    gap:12px;

}

.ai-orb{

    width:38px;
    height:38px;

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #fff,
            #8da9c7 35%,
            #26384c 70%,
            #0b1119
        );

    box-shadow:
        0 0 25px
        rgba(141,169,199,.3);

}

.chat-title{

    font-size:14px;

    font-weight:700;

}

.chat-status{

    font-size:10px;

    color:
        rgba(255,255,255,.42);

    margin-top:3px;

}

.messages{

    height:330px;

    overflow-y:auto;

    padding:18px;

    display:flex;

    flex-direction:column;

    gap:12px;

}

.message{

    display:flex;

}

.message.user{

    justify-content:flex-end;

}

.bubble{

    max-width:82%;

    padding:
        12px
        15px;

    border-radius:16px;

    background:
        rgba(255,255,255,.07);

    border:
        1px solid
        rgba(255,255,255,.07);

    color:
        rgba(255,255,255,.85);

    font-size:13px;

    line-height:1.6;

}

.message.user .bubble{

    background:
        rgba(255,255,255,.13);

    color:#fff;

}

/* =========================
   INPUT
========================= */

.chat-input-area{

    padding:14px;

    border-top:
        1px solid
        rgba(255,255,255,.07);

    display:flex;

    gap:9px;

}

#chatInput{

    flex:1;

    min-width:0;

    border:1px solid
        rgba(255,255,255,.1);

    outline:none;

    border-radius:14px;

    padding:
        13px
        14px;

    background:
        rgba(255,255,255,.045);

    color:#fff;

}

#chatInput::placeholder{

    color:
        rgba(255,255,255,.3);

}

#sendBtn{

    width:48px;

    border:0;

    border-radius:14px;

    background:#fff;

    color:#05070b;

    font-size:18px;

}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .navbar{

        padding:
            15px;

    }

    .hero{

        padding-top:45px;

    }

    .hero h1{

        letter-spacing:-2.5px;

    }

    .messages{

        height:300px;

    }

}

</style>

</head>

<body>

<div class="background"></div>

<div class="app">

    <nav class="navbar">

        <div class="logo">

            <div class="logo-mark">
                ✦
            </div>

            <div class="logo-text">

                KAINTHLA TRAVEL AI

                <small>
                    Explore Beyond
                </small>

            </div>

        </div>

    </nav>

    <main class="hero">

        <div class="badge">

            <span class="badge-dot"></span>

            AI TRAVEL COMPANION

        </div>

        <h1>

            Find your next
            <span>journey.</span>

        </h1>

        <p>

            Discover destinations, treks, routes,
            stays and experiences with your personal
            Kainthla Travel AI.

        </p>

        <button
            class="start-btn"
            onclick="openTravelAI()">

            Start exploring

            <span>→</span>

        </button>

        <section
            class="chat-section"
            id="travelAI">

            <div class="chat-box">

                <div class="chat-header">

                    <div class="ai-orb"></div>

                    <div>

                        <div class="chat-title">
                            Kainthla Travel AI
                        </div>

                        <div class="chat-status">
                            Your intelligent travel companion
                        </div>

                    </div>

                </div>

                <div
                    class="messages"
                    id="messages">

                </div>

                <div class="chat-input-area">

                    <input
                        id="chatInput"
                        type="text"
                        placeholder="Ask about a destination..."
                        autocomplete="off">

                    <button
                        id="sendBtn"
                        type="button">

                        ↑

                    </button>

                </div>

            </div>

        </section>

    </main>

</div>

<script>

/* =========================
   CONFIG
========================= */

const TRAVEL_AI_API =
"https://script.google.com/macros/s/AKfycbwxZhBDGOTa4TFN2XAg_ihpIuvVbjJPiDzGt3vpyfuOqZdUXHzOYZ-YoP1Pe7tJZk-ldg/exec";

const TRAVEL_360_ASSET =
"1aebea2f-ed66-4843-80ef-f381f65cfe50.web";

/* =========================
   OPEN AI
========================= */

function openTravelAI(){

    document
        .getElementById("travelAI")
        .scrollIntoView({
            behavior:"smooth"
        });

}

/* =========================
   ELEMENTS
========================= */

const messages =
    document.getElementById("messages");

const input =
    document.getElementById("chatInput");

const sendBtn =
    document.getElementById("sendBtn");

/* =========================
   ADD MESSAGE
========================= */

function addMessage(text,type){

    const message =
        document.createElement("div");

    message.className =
        "message " + type;

    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";

    bubble.textContent = text;

    message.appendChild(bubble);

    messages.appendChild(message);

    messages.scrollTop =
        messages.scrollHeight;

}

/* =========================
   WELCOME
========================= */

addMessage(
    "Welcome to Kainthla Travel AI 🌍 Ask me where your next journey should take you.",
    "ai"
);

</script>

</body>

</html>
<script>

const TRAVEL_AI_API =
"https://script.google.com/macros/s/AKfycbwxZhBDGOTa4TFN2XAg_ihpIuvVbjJPiDzGt3vpyfuOqZdUXHzOYZ-YoP1Pe7tJZk-ldg/exec";

const messages =
    document.getElementById("messages");

const input =
    document.getElementById("chatInput");

const sendBtn =
    document.getElementById("sendBtn");


function addMessage(text, type){

    const message =
        document.createElement("div");

    message.className =
        "message " + type;

    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";

    bubble.textContent = text;

    message.appendChild(bubble);

    messages.appendChild(message);

    messages.scrollTop =
        messages.scrollHeight;
}


function sendMessage(){

    const text =
        input.value.trim();

    if(!text) return;

    addMessage(text, "user");

    input.value = "";

    addMessage(
        "Thinking...",
        "ai"
    );

    fetch(
        TRAVEL_AI_API +
        "?message=" +
        encodeURIComponent(text)
    )
    .then(function(response){

        return response.json();

    })
    .then(function(data){

        messages.lastElementChild.remove();

        if(data.success){

            addMessage(
                data.message,
                "ai"
            );

        }else{

            addMessage(
                "Sorry, AI response nahi aa paaya.",
                "ai"
            );

            console.log(data.error);
        }

    })
    .catch(function(error){

        messages.lastElementChild.remove();

        addMessage(
            "Connection error. Please try again.",
            "ai"
        );

        console.error(error);

    });

}


sendBtn.addEventListener(
    "click",
    sendMessage
);


input.addEventListener(
    "keydown",
    function(e){

        if(e.key === "Enter"){

            e.preventDefault();

            sendMessage();

        }

    }
);


function openTravelAI(){

    document
        .getElementById("travelAI")
        .scrollIntoView({
            behavior:"smooth"
        });

    setTimeout(function(){

        input.focus();

    },500);

}


addMessage(
    "Welcome to Kainthla Travel AI 🌍 Ask me about destinations, treks, routes, budgets or travel plans.",
    "ai"
);

</script>

</body>

</html>
